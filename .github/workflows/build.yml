name: Build All Platforms

on:
  push:
    paths:
      - 'android/**'
      - 'linux/**'
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'linux/**'
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - '.github/workflows/build.yml'
            linux:
              - 'linux/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - '.github/workflows/build.yml'
            windows:
              - 'windows/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - '.github/workflows/build.yml'

  build-linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev liblzma-dev
      - run: flutter build linux
      - name: Prepare Linux artifact folder
        run: |
          mkdir -p artifacts/BASDAI-Calculator
          cp -R build/linux/x64/release/bundle/. artifacts/BASDAI-Calculator/
      - uses: actions/upload-artifact@v4
        with:
          name: BASDAI-Calculator-linux
          path: artifacts/BASDAI-Calculator/

  build-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows
      - name: Prepare Windows artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/BASDAI-Calculator | Out-Null
          Copy-Item -Path build/windows/x64/runner/Release/* -Destination artifacts/BASDAI-Calculator -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BASDAI-Calculator-windows
          path: artifacts/BASDAI-Calculator/

  build-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BASDAI-Calculator-android
          path: build/app/outputs/flutter-apk/app-release.apk